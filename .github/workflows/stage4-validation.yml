name: Stage 4 Playgama GUI and Gameplay Validation

on:
  push:
    branches: [feature/playgama-gui-polish-stage4]
  workflow_dispatch:

concurrency:
  group: stage4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript production build and GLB asset verification
        run: npm run build
      - name: Start authoritative multiplayer server and 3D frontend
        run: |
          nohup npm run server > /tmp/rift-server.log 2>&1 &
          nohup npm run dev -- --port 5173 --strictPort > /tmp/rift-web.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:2567/health >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rift-server.log /tmp/rift-web.log
          exit 1
      - name: Multiplayer and regression tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: GUI/landscape browser smoke test
        run: node tests/stage4-browser.mjs
